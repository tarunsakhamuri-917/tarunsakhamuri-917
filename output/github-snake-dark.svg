<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="140" viewBox="0 0 800 140" preserveAspectRatio="xMidYMid meet">
  <rect width="100%" height="100%" fill="transparent"/>
  <!-- Dark-theme snake -->
  <g id="snake-dark" transform="translate(20,70)">
    <circle cx="0" cy="0" r="14" fill="#7ee787" />
    <circle cx="36" cy="0" r="16" fill="#4ade80" />
    <circle cx="72" cy="0" r="18" fill="#7ee787" />
    <circle cx="112" cy="0" r="20" fill="#4ade80" />
    <circle cx="156" cy="0" r="18" fill="#7ee787" />
    <circle cx="196" cy="0" r="16" fill="#4ade80" />
    <circle cx="236" cy="0" r="14" fill="#7ee787" />
    <circle cx="276" cy="0" r="12" fill="#4ade80" />
    <circle cx="316" cy="0" r="10" fill="#7ee787" />
    <circle cx="356" cy="0" r="8" fill="#4ade80" />
    <!-- eye -->
    <circle cx="-6" cy="-4" r="3" fill="#001219" />
    <path d="M-2 -10 q10 -14 22 0" fill="none" stroke="#001219" stroke-width="3" stroke-linecap="round"/>
  </g>
  <style>
    @keyframes bob_dark { 0% { transform: translateY(0px); } 50% { transform: translateY(-6px); } 100% { transform: translateY(0px); } }
    #snake-dark { animation: bob_dark 2.6s ease-in-out infinite; }
  </style>
</svg>
