<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="140" viewBox="0 0 800 140" preserveAspectRatio="xMidYMid meet">
  <rect width="100%" height="100%" fill="transparent"/>
  <!-- Simple snake made of circles -->
  <g id="snake" transform="translate(20,70)">
    <circle cx="0" cy="0" r="14" fill="#16a34a" />
    <circle cx="36" cy="0" r="16" fill="#22c55e" />
    <circle cx="72" cy="0" r="18" fill="#16a34a" />
    <circle cx="112" cy="0" r="20" fill="#22c55e" />
    <circle cx="156" cy="0" r="18" fill="#16a34a" />
    <circle cx="196" cy="0" r="16" fill="#22c55e" />
    <circle cx="236" cy="0" r="14" fill="#16a34a" />
    <circle cx="276" cy="0" r="12" fill="#22c55e" />
    <circle cx="316" cy="0" r="10" fill="#16a34a" />
    <circle cx="356" cy="0" r="8" fill="#22c55e" />
    <!-- eye -->
    <circle cx="-6" cy="-4" r="3" fill="#08141a" />
    <path d="M-2 -10 q10 -14 22 0" fill="none" stroke="#08141a" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g id="ground" transform="translate(0,110)">
    <rect x="0" y="0" width="800" height="30" fill="#f3f4f6" opacity="0.0" />
  </g>
  <style>
    /* simple floating animation */
    @keyframes bob { 0% { transform: translateY(0px); } 50% { transform: translateY(-6px); } 100% { transform: translateY(0px); } }
    #snake { animation: bob 2.6s ease-in-out infinite; }
  </style>
</svg>
